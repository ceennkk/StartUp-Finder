# Source-specific configuration. Every URL below was taken from the sources' own sitemaps/pages.
exist:
  success_story_sitemap: https://exist.de/success-story-sitemap1.xml
  wp_api: https://exist.de/wp-json/wp/v2/success-story   # public WordPress REST API; used for publication dates only
  min_interval_seconds: 2
  lookback_days: 7
  programs:                      # keywords decide which programme a story text mentions (relationship stays "unverified")
    - {key: gruendungsstipendium, name: "EXIST-Gründungsstipendium", url: "https://exist.de/programm/gruendungsstipendium/", keywords: ["Gründungsstipendium"]}
    - {key: forschungstransfer, name: "EXIST-Forschungstransfer", url: "https://exist.de/programm/forschungstransfer/", keywords: ["Forschungstransfer"]}
    - {key: women, name: "EXIST-Women", url: "https://exist.de/programm/women/", keywords: ["exist women", "EXIST-Women"]}

# CORDIS: EU research projects via the public EURIO SPARQL endpoint (CC BY 4.0, attribution "© European Union, CORDIS").
# Only projects with at least one participant in `countries` (ISO 3166-1 alpha-2); only those participants are stored.
# The endpoint has no documented limits: requests are spaced >= 10 s and kept small. No bulk ZIPs (robots.txt disallows /data/).
cordis:
  endpoint: https://cordis.europa.eu/datalab/sparql-api
  countries: ["DE"]
  initial_days: 90               # first run: projects whose startDate lies this many days back (up to today + future_days)
  future_days: 0
  lookback_days: 60              # later runs re-read this overlap; CORDIS exposes no change date
  page_size: 25                  # projects per request (max 50); each page costs two requests
  max_projects_per_run: 1000
  min_interval_seconds: 10

# Manual import of reference lists (local CSV/JSON files only, no network). Files are read from MANUAL_IMPORT_DIR
# (default data/manual_imports/), which is git-ignored together with its subdirectories.
manual_import:
  extensions: [".csv", ".json"]
  max_file_bytes: 5000000
  max_rows_per_file: 5000
  processed_retention_days: 30   # successfully imported files are moved to processed/ and deleted after this period
  failed_retention_days: 14      # rejected files are moved to failed/ and deleted after this period

# University sources. Each entry is one explicit page/feed (no crawling). robots.txt is always checked.
# connector: rss | sitemap (validated sitemap + url_pattern + JSON-LD per page) | jsonld (urls) | html (CSS selectors)
#            | page_metadata (url + urls + optional validated sitemap with path prefix; title/description only)
# kind: press_release | news | research_project | organization_unit   plugin: optional name from plugins.py
# group: optional; sources of one university share one university entity. enabled: false = collector off.
# Non-RSS connectors always wait >= 10 s between requests to a host.
universities:
  sources:
    - key: kit
      name: Karlsruher Institut für Technologie
      aliases: ["KIT", "Karlsruhe Institute of Technology"]
      country: DE
      website: https://www.kit.edu
      connector: rss
      url: https://kit.edu/pi.rss                # offered by KIT on its press releases page
      kind: press_release
      plugin: kit
    - key: tu_darmstadt
      name: Technische Universität Darmstadt
      aliases: ["TU Darmstadt"]
      country: DE
      website: https://www.tu-darmstadt.de
      connector: rss
      url: https://www.tu-darmstadt.de/universitaet/aktuelles_meldungen/neues_aus_der_tu_rss.de.rss
      kind: news
    # --- University of Duisburg-Essen (UDE): first fully worked example -------------------------------------
    # All three sources share group "ude" (one university entity) and can be selected with
    # `collect university --source ude` or individually. UDE publishes no reuse/licence terms that cover
    # automated reuse, so only the research feed (metadata + <=500 char teaser, no enclosures) is enabled.
    # robots.txt disallows GPTBot; this collector identifies itself and must not be repurposed for AI training.
    # require_contact_email: the User-Agent must name a contact (CONTACT_EMAIL), otherwise the run aborts.
    - key: ude_forschung
      group: ude
      name: Universität Duisburg-Essen
      aliases: ["UDE", "University of Duisburg-Essen", "Uni Duisburg-Essen"]
      country: DE
      website: https://www.uni-due.de
      connector: rss
      url: https://www.uni-due.de/rss/forschung.rss     # linked from https://www.uni-due.de/de/presse/feeds.php
      kind: news
      min_interval_seconds: 10
      require_contact_email: true
      max_items: 200
      initial_days: 90
      lookback_days: 7
      properties: {topic: research}
    - key: ude_aktuell
      group: ude
      name: Universität Duisburg-Essen
      aliases: ["UDE", "University of Duisburg-Essen", "Uni Duisburg-Essen"]
      country: DE
      website: https://www.uni-due.de
      connector: rss
      url: https://www.uni-due.de/rss/aktuell.rss
      kind: news
      enabled: false                                   # secondary source; enable once usage terms are clarified
      min_interval_seconds: 10
      require_contact_email: true
      max_items: 200
      initial_days: 30
      lookback_days: 7
      properties: {topic: general}
    - key: ude_guide
      group: ude
      name: Universität Duisburg-Essen
      aliases: ["UDE", "University of Duisburg-Essen", "Uni Duisburg-Essen"]
      country: DE
      website: https://www.uni-due.de
      connector: page_metadata
      url: https://www.uni-due.de/guide/                 # GUIDE start-up centre; only title/description are read
      urls: []                                           # more explicit pages may be listed here
      sitemap:                                           # validated before use; discovery limited to this prefix
        url: https://www.uni-due.de/sitemap.xml
        prefix: /guide/
        max_pages: 5
      kind: organization_unit
      unit_name: GUIDE (Universität Duisburg-Essen)
      unit_aliases: ["GUIDE"]
      enabled: false                                   # targeted source; enable once usage terms are clarified
      min_interval_seconds: 10
      require_contact_email: true
      initial_days: 3650
      properties: {topic: startup_support}
    # Template for a university without a feed (disabled until a real page has been checked against its robots.txt):
