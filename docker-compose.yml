services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ventureradar
      POSTGRES_PASSWORD: ventureradar
      POSTGRES_DB: ventureradar_test
    ports:
      - "5433:5432"
    volumes:
      - ventureradar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ventureradar -d ventureradar_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ventureradar_pgdata:
