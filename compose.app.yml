# docker compose -f compose.yml -f compose.app.yml up --build
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      APP_MODE: live
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-startup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-startup}
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
  worker:
    build: .
    command: ["python", "-m", "startup_finder", "worker"]
    env_file: .env
    environment:
      APP_MODE: live
      DATABASE_URL: postgresql://${POSTGRES_USER:-startup}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-startup}
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
