[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "startup-finder"
version = "0.1.0"
description = "Startup Finder API and VentureRadar data collectors"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.11",
    "tenacity>=9.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
live = ["graphiti-core>=0.17,<1"]
dev = ["pytest>=8.3", "respx>=0.21"]

[project.scripts]
startup-graph = "startup_finder.cli:main"
startup-finder = "startup_finder.__main__:main"
ventureradar = "app.cli:main"

[tool.setuptools.packages.find]
include = ["startup_finder*", "app*"]

[tool.setuptools.package-data]
startup_finder = ["static/*.html", "static/*.js"]
app = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
    "live: calls real external services (deselect with -m 'not live')",
]
addopts = "-m 'not live'"
