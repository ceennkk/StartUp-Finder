[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ventureradar-ingestion"
version = "0.1.0"
description = "VentureRadar data ingestion: collectors, normalization and storage in PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.10",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0.11",
    "tenacity>=9.0",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
]

[project.scripts]
ventureradar = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a PostgreSQL database (TEST_DATABASE_URL)",
    "live: calls real external services (deselect with -m 'not live')",
]
addopts = "-m 'not live'"
